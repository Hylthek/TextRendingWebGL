<head>
  <title>WebGL Text Rendering</title>
  <!-- HarfBuzz files (load in order!) -->
  <script src="./node_modules/harfbuzzjs/hb.js"></script>
  <script src="./node_modules/harfbuzzjs/hbjs.js"></script>
</head>

<style>
  body {
    background-color: black;
  }

  canvas {
    width: min(90vw, calc(90vh * 16 / 9));
    height: min(calc(90vw * 9 / 16), 90vh);
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border: 0.18vw solid #00FF41;
  }

  canvas#debug-canvas {
    left: 5vw;
    top: calc(5vh * 9/16);
    width: 20vw;
    height: calc(20vw * 9/16);
    display: none;
  }

  @font-face {
    font-family: 'Terminal';
    src: url('./Terminal_ttf/Terminal.ttf') format('truetype');
  }

  .fps-div {
    position: fixed;
    transform: translate(-50%, -50%);
    top: calc((100vh - min(90vh, calc(90vw * 9 / 16)))/4);
    left: calc(50vw);
    font-family: Terminal;
    font-size: min(2.044vw, calc(2.044vh * 16 / 9));
    color: #00FF41;
    display: inline-block;
    white-space: nowrap;
  }

  .view-div {
    position: fixed;
    transform: translate(-50%, +50%);
    bottom: calc((100vh - min(90vh, calc(90vw * 9 / 16))) / 4);
    left: calc(50vw);
    font-family: Terminal;
    font-size: min(2.044vw, calc(2.044vh * 16 / 9));
    color: #00FF41;
    display: inline-block;
    white-space: nowrap;
  }
</style>

<body>
  <canvas id="cal-vas"></canvas>
  <canvas id="debug-canvas"></canvas>
  <div class="fps-div">
    <span>FPS: </span>
    <span id="fps">[]</span>
  </div>
  <div class="view-div">
    <span>Zoom: </span>
    <span id="zoom">[]</span>
    <span>Pan: </span>
    <span id="pan">[]</span>
  </div>
</body>


<script src="cal-vas.js" type="module"></script>
